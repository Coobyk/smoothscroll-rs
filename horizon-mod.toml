id = "smoothscroll"
name = "Smooth Scroll"
version = "1.0.0"
api = "0.2"
side = "client"
capabilities = ["registries"]
description = "Animates scroll offsets in scrollable UI instead of snapping them"

[native]
game = "26.3"
horizon = "f00125f61f794aaa3d4e950d301f353b35b6ee3d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Game-side state: the pending wheel delta of the surface that took the last
# wheel event, eased out over the next frames. Helpers call
# `crate::game::umbx_smoothscroll::{smoothing, push, push_xy, flushing, frame}`.
[[native.module]]
id = "scroll_state"
file = "crates/horizon-client/src/game.rs"
name = "umbx_smoothscroll"
source = "src/scroll.rs"

# Once a frame: ease each pending wheel delta a step closer to done.
[[native.mixin]]
id = "frame"
target = "horizon_client::game::native_hooks::render_frame_pre::Game::native_render_frame_pre"
kind = "HEAD"
helper = "src/mixins/frame.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

# Each scrollable screen defers its wheel delta instead of applying it; the
# frame hook replays the pending delta in eased steps through the same code
# path (the overwritten body checks `flushing`).
[[native.mixin]]
id = "chat"
target = "horizon_client::game::chat::Game::chat_scroll"
kind = "OVERWRITE"
helper = "src/mixins/chat.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "amount", ty = "f32", value = "amount" },
]

[[native.mixin]]
id = "options"
target = "horizon_client::game::options::Game::options_scroll"
kind = "OVERWRITE"
helper = "src/mixins/options.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "amount", ty = "f32", value = "amount" },
